# Odoo 18 vhost template - copy to /etc/nginx/sites-available/<domain>
# Then: sudo ln -s /etc/nginx/sites-available/<domain> /etc/nginx/sites-enabled/
# And:  sudo certbot --nginx -d <domain>

upstream odoo18 {
    server 127.0.0.1:8069;
}

upstream odoo18-longpolling {
    server 127.0.0.1:8072;
}

server {
    listen 80;
    server_name odoo.example.com;

    client_max_body_size 200m;

    access_log /var/log/nginx/odoo18_access.log;
    error_log /var/log/nginx/odoo18_error.log;

    location / {
        proxy_pass http://odoo18;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 720s;
        proxy_connect_timeout 720s;
        proxy_send_timeout 720s;
    }

    location /longpolling {
        proxy_pass http://odoo18-longpolling;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* /web/static/ {
        proxy_pass http://odoo18;
        proxy_set_header Host $host;
        expires 30d;
    }
}
