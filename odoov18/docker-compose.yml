services:
  odoo:
    image: ${ODOO_IMAGE:-odoo:18.0}
    container_name: ${COMPOSE_PROJECT_NAME:-odoov18}_web
    depends_on:
      - db
    ports:
      # Bound to localhost only: nginx is the public entrypoint
      - "127.0.0.1:${ODOO_PORT:-8069}:8069"
      - "127.0.0.1:${ODOO_LONGPOLLING_PORT:-8072}:8072"
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, check your .env}
    volumes:
      - odoo-data:/var/lib/odoo
      - ./config:/etc/odoo:ro
      - ./addons:/mnt/extra-addons
      - ./backups:/backups
    restart: unless-stopped

  db:
    image: ${POSTGRES_IMAGE:-postgres:15}
    container_name: ${COMPOSE_PROJECT_NAME:-odoov18}_db
    shm_size: 512mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, check your .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  odoo-data:
  db-data:
