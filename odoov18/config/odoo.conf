[options]
; Module paths: Odoo only sees direct modules of each path (not recursive)
addons_path = /mnt/extra-addons/enterprise,
    /mnt/extra-addons/custom,
    /usr/lib/python3/dist-packages/odoo/addons

data_dir = /var/lib/odoo

; Database connection (real values come from the db service / .env via HOST/USER/PASSWORD)
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; Restrict which databases are visible per hostname: ^%d$ = db name must equal subdomain
; For a single-db deployment use: dbfilter = ^NOMBRE_DB$
dbfilter = ^%d$

; Master password for create/delete databases - CHANGE ON DEPLOY
admin_passwd = CHANGE_ME_STRONG_MASTER_PASSWORD

; Hide the database manager in production after the DB is created/restored
list_db = False

; Network
http_port = 8069
longpolling_port = 8072
proxy_mode = True

; Performance and logs (workers > 0 required for longpolling behind nginx)
workers = 2
log_level = info
logfile = False
